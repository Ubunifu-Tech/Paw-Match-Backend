# Nixpacks will auto-detect Python and run: pip install -r requirements.txt
# Set "Root Directory" to "backend" in Railway Service Settings

[phases.setup]
nixPkgs = ["python311", "postgresql", "gcc"]
aptPkgs = ["postgresql-client"]

[phases.install]
cmds = ["python3 -m pip install -r requirements.txt"]

[start]
cmd = "python3 -m alembic upgrade head && python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
